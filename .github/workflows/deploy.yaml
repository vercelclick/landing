name: Build and Deploy to Cloudflare Workers

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install Click cli
        run: curl -LsSf https://github.com/vercelclick/cli/releases/latest/download/click-cli-installer.sh | sh

      - name: Install Dependencies
        run: bun install

      - name: Deploy to Cloudflare workers
        run: click run --access-key ${{ secrets.CLICK_ACCESS_KEY }} --env production -- bun run deploy
